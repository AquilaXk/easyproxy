    The easyproxy chevron+prism app icon. Every committed raster in this directory is rendered from this file
    by desktop/scripts/generate-icons.ts, so all platform sizes derive from one source.

    The artwork inside #mark embeds scripts/brand/easyproxy-mark.svg verbatim over a beveled dark squircle plate.
    The .icns is rendered from a full-bleed copy where generate-icons.ts strips rx on #backdrop so macOS applies its own mask.
