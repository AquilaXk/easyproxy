<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="easyproxy">
  <!--
    The menu bar variant of icon.svg: the two chevron+prism silhouette contours rendered in
    black and transparency with a mask cutout separating overlapping layers so macOS menu bar
    template tinting preserves crisp separation at 22pt @2x.

    tests/ci-workflows/build-desktop-icon-set.test.ts verifies every curve here appears verbatim
    in icon.svg and that the separation mask remains wired to #mark.
  -->
