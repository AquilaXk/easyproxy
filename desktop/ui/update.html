          var mode = null;

          if (mode === "light" || mode === "dark") {

    <style>

        --fg: #f8fafc;
        --fg-muted: #a6b3c6;
        --accent: #2563eb;
        --accent-hover: #3b82f6;

        --danger-soft: rgb(248 113 113 / 0.14);

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg: #0b0e14;
          --surface: #111620;
          --surface-2: #161d2a;
          --raised: #1b2333;
          --line: rgb(148 163 184 / 0.14);
          --line-strong: rgb(148 163 184 / 0.25);
          --fg: #f8fafc;
          --fg-muted: #a6b3c6;
          --accent: #2563eb;
          --accent-hover: #3b82f6;
          --accent-soft: rgb(96 165 250 / 0.16);
          --on-accent: #ffffff;
          --highlight: #60a5fa;
          --danger: #f87171;
          --danger-soft: rgb(248 113 113 / 0.14);
        }
      }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 40px 16px; background: var(--bg); color: var(--fg); }
      main { width: min(34rem, 100%); padding: 4px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
      header { display: flex; align-items: center; gap: 10px; padding: 10px 12px 12px; }
      .brand-mark { display: block; width: 24px; height: auto; flex: none; color: var(--fg); }
      h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
      .body { display: grid; gap: 14px; padding: 18px; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
      p { margin: 0; }
      #state { min-height: 1.5em; font-size: 15px; font-weight: 500; letter-spacing: -0.005em; }
      #error { padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 13px; overflow-wrap: anywhere; }
      #error[hidden], #manual[hidden] { display: none; }
      #manual { font-size: 13px; }
      a { color: var(--highlight); text-underline-offset: 2px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 2px; }
      button { display: inline-flex; align-items: center; justify-content: center; height: var(--control-h); border: 0; border-radius: 10px; padding: 0 14px; background: var(--raised); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; transition: background-color .15s, opacity .15s; }
      button:hover:not([disabled]) { background: var(--surface-2); }
      button.primary { background: var(--accent); color: var(--on-accent); box-shadow: none; }
      button.primary:hover:not([disabled]) { background: var(--accent-hover); }
      button.ghost { margin-left: auto; background: transparent; box-shadow: none; color: var(--fg-muted); }
      button.ghost:hover:not([disabled]) { background: var(--accent-soft); color: var(--fg); }
      button[disabled] { opacity: .5; cursor: default; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
      /* Overlay title bar grip on macOS; hidden everywhere else (native decorations). */
      #titlebar { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 1; user-select: none; -webkit-user-select: none; }
      #titlebar[hidden] { display: none; }
    </style>
  </head>

    <div id="titlebar" hidden></div>
    <main>

        <h1>EasyProxy update</h1>
      </header>
      <div class="body">
        <p id="state" role="status" aria-live="polite">Reading update status…</p>
        <p id="error" role="alert" hidden></p>
        <p id="manual" hidden><a id="release"></a></p>
        <div class="actions">
          <button id="install" type="button" class="primary" disabled>Install update</button>
          <button id="check" type="button">Check again</button>
          <button id="back" type="button" class="ghost">Back to dashboard</button>
        </div>
      </div>
    </main>
    <script nonce="__TAURI_SCRIPT_NONCE__">

const check = document.querySelector("#check");
const install = document.querySelector("#install");

  const hint = version
    ? " If automatic download is slow or blocked by network, install the package manually from GitHub Releases (v" + version + ")."
    : "";
  error.textContent = message + hint;
  error.hidden = false;
  manual.hidden = !version;
  release.textContent = version ? "Download v" + version + " from GitHub Releases" : "";
  release.href = version ? "https://github.com/AquilaXk/easyproxy/releases/tag/v" + encodeURIComponent(version) : "";

  manual.hidden = true;
