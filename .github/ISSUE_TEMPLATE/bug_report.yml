name: Bug Report
description: Report a reproducible defect in EasyProxy CLI, proxy gateway, dashboard, or desktop app
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report undisclosed security vulnerabilities privately through [GitHub Security Advisories](https://github.com/AquilaXk/easyproxy/security/advisories/new) instead of opening a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the bug.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, install channel (npm / desktop / source), and `epx --version`.
      placeholder: "macOS 15 arm64, npm, epx 0.1.0"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact commands or configuration steps that trigger the issue. Never paste API keys or tokens.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What should happen vs what actually happened (include sanitized `epx doctor` or error output if available).
    validations:
      required: true
