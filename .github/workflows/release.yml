name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release channel (latest or preview)"
        required: true
        type: choice
        options:
          - latest
          - preview
        default: latest
      expected-sha:
        description: "Optional exact full source SHA on main"
        required: false
        type: string
      dry-run:
        description: "Dry run (build + verify + pack, no publish)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.expected-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
        with:
          role: runtime

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd gui --frozen-lockfile

      - name: Verify release metadata and gates
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_REF: ${{ github.ref }}
          CHANNEL: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflow_dispatch must run from main."
            exit 1
          fi
          bun scripts/check-repo-hygiene.ts
          bun scripts/release-version-sources.ts check
          bun run typecheck
          bun run typecheck:tsc
          bun run privacy:scan
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Tag ${REF_NAME} does not match package.json version ${pkg_version}"
              exit 1
            fi
            publish="true"
          else
            publish="false"
            if [ "${DRY_RUN:-true}" = "false" ]; then
              publish="true"
            fi
          fi
          prerelease="false"
          if [[ "$pkg_version" == *-* ]] || [ "${CHANNEL:-latest}" = "preview" ]; then
            prerelease="true"
          fi
          {
            echo "version=${pkg_version}"
            echo "release_tag=v${pkg_version}"
            echo "publish=${publish}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  standalone:
    name: standalone (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            os: macos-15
            target: bun-darwin-arm64
            archive: easyproxy-darwin-arm64.tar.gz
          - label: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            archive: easyproxy-linux-x64.tar.gz
          - label: windows-x64
            os: windows-latest
            target: bun-windows-x64
            archive: easyproxy-windows-x64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.expected-sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
        with:
          role: runtime

      - name: Build GUI and standalone binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:gui
          bun run build:epx-child
          bun run build:remote-workspace-helper
          bun scripts/build-standalone.ts --target "$TARGET" --out "dist/standalone/${TARGET}"
          mkdir -p dist/release-assets
          if [[ "$ARCHIVE" == *.zip ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/standalone/${TARGET}/*' -DestinationPath 'dist/release-assets/${ARCHIVE}' -Force"
          else
            tar -C "dist/standalone/${TARGET}" -czf "dist/release-assets/${ARCHIVE}" .
          fi

      - name: Upload standalone archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.label }}
          path: dist/release-assets/${{ matrix.archive }}
          if-no-files-found: error

  publish-release:
    name: github release
    needs: [verify, standalone]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum easyproxy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.release_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "EasyProxy ${TAG}" "${flags[@]}"
          fi
