name: Latest Release Guard

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: latest-guard
  cancel-in-progress: false

jobs:
  guard:
    name: guard-latest-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
        with:
          role: runtime

      - name: Verify latest release pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/latest-guard.ts
